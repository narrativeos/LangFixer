[package]
name = "shared-model"
description = "LangFixer 统一数据模型：错误结构、归因请求/结果、用户画像、决策表元数据"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true, optional = true }
fsrs = { version = "6.6", optional = true }

[features]
# SQLite 持久化会话存储（api-server / desktop-app 启用；引擎侧不依赖，保持轻量）
# FSRS 间隔复习调度（fsrs-rs，Anki 同款算法）随存储启用
sqlite = ["dep:rusqlite", "dep:fsrs"]
