version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/web-ui"
    schedule:
      interval: weekly
    groups:
      web-deps:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
