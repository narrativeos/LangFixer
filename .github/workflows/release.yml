name: Release

# 发布流水线：补 scripts/release.sh（mac 本机三源构建）之外的平台产物。
# 发布源在构建时烧入二进制（desktop-app/build.rs），因此 Windows / Linux 包
# 按 github / atomgit 两个发布源各打一份，分别发到对应源的 release，用户从
# 哪个源下载就从哪个源更新（Gitea 只作代码源，不发产物）。每源的 publish 任务会把该标签已有资产（如
# release.sh 先传的 mac 包）拉回重算 latest.json，保证清单覆盖全部平台键。
# mac 安装包仍由 release.sh 在开发机构建；密钥缺失会在对应任务里显式报错。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（如 v1.2.0）
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-github:
    name: 安装包 (github / ${{ matrix.osLabel }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, osLabel: Windows }
          - { os: ubuntu-22.04, osLabel: Linux }
    runs-on: ${{ matrix.os }}
    env:
      LANGFIXER_RELEASE_SOURCE: github
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      # 必须检出标签对应的提交：workflow_dispatch 补历史版本时，HEAD 可能已领先标签，
      # 用分支代码打出的包与 tag 名不符。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 检查更新签名密钥
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少仓库 secret TAURI_SIGNING_PRIVATE_KEY（内容为 ~/.config/langfixer/updater.key）。tauri.conf.json 已开启 createUpdaterArtifacts，无私钥时 tauri build 会直接失败。"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      # 与 ci.yml 同一套依赖；webkit2gtk 必须是 4.1（Tauri 2 不支持 4.0）
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 前端在步骤里显式构建：GitHub 检出比本机多套一层 workspace 目录，
      # tauri.conf.json 的 beforeBuildCommand（npm --prefix ../web-ui run build）
      # 会把相对路径解析到仓库外，故用内联 --config 将其改为空操作。
      - name: 前端构建
        shell: bash
        run: |
          cd web-ui
          npm ci --no-audit --no-fund
          npm run build

      - name: tauri build
        shell: bash
        working-directory: desktop-app
        run: npx --yes @tauri-apps/cli@2 build --config '{"build":{"beforeBuildCommand":"node --version"}}'

      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          find target/release/bundle -type f -name 'LangFixer*' \
            \( -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp -p {} packages/ \;
          find target/release/bundle -type f \
            \( -name 'LangFixer*.AppImage.sig' -o -name 'LangFixer*-setup.exe.sig' -o -name 'LangFixer*.msi.sig' \) \
            -exec cp -p {} packages/ \;
          ls -l packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages-github-${{ matrix.osLabel }}
          path: packages/

  build-atomgit:
    name: 安装包 (atomgit / ${{ matrix.osLabel }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, osLabel: Windows }
          - { os: ubuntu-22.04, osLabel: Linux }
    runs-on: ${{ matrix.os }}
    env:
      LANGFIXER_RELEASE_SOURCE: atomgit
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 前端构建
        shell: bash
        run: |
          cd web-ui
          npm ci --no-audit --no-fund
          npm run build
      - name: tauri build
        shell: bash
        working-directory: desktop-app
        run: npx --yes @tauri-apps/cli@2 build --config '{"build":{"beforeBuildCommand":"node --version"}}'
      - name: 收集产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          find target/release/bundle -type f -name 'LangFixer*' \
            \( -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp -p {} packages/ \;
          find target/release/bundle -type f \
            \( -name 'LangFixer*.AppImage.sig' -o -name 'LangFixer*-setup.exe.sig' -o -name 'LangFixer*.msi.sig' \) \
            -exec cp -p {} packages/ \;
          ls -l packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-atomgit-${{ matrix.osLabel }}
          path: packages/

  publish-github:
    name: 合入 GitHub Release
    needs: build-github
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-github-*
          path: packages
          merge-multiple: true

      - name: 合并产物与 latest.json 并上传
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          dir="dist/github/$TAG"
          mkdir -p "$dir"
          # release 不存在则创建；tag 带 -rc/-preview 等后缀按预发布处理
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY"; then
            case "$TAG" in
              *-*) gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag --prerelease ;;
              *)   gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag ;;
            esac
          fi
          # 把该 release 已有资产（如 release.sh 先上传的 mac 包与 .sig）拉到同一目录，
          # make_latest_json.py 扫描全部 .sig 才能产出含 darwin 键的完整清单。
          # 首次运行且 release 尚无资产时下载报错属正常，忽略。
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" --clobber || true
          cp -p packages/* "$dir/"
          python3 scripts/make_latest_json.py github "$TAG" "$dir"
          # 只上传新产物与重算后的 latest.json，已有 mac 资产原样保留
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" packages/* "$dir/latest.json" --clobber

  publish-atomgit:
    name: 发布到 AtomGit Release
    needs: build-atomgit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-atomgit-*
          path: packages
          merge-multiple: true

      - name: 发布（创建/补齐发行版、重算并替换 latest.json）
        shell: bash
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${ATOMGIT_TOKEN:-}" ]; then
            echo "::error::缺少仓库 secret ATOMGIT_TOKEN（atomgit.com 个人设置→私人令牌）。"
            exit 1
          fi
          dir="dist/atomgit/$TAG"
          mkdir -p "$dir"
          cp packages/* "$dir/"
          python3 scripts/publish_atomgit.py "$TAG" "$dir"
