name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在的做法哪里不够好，什么场景受影响
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你设想的界面 / API / 行为（可多选方案对比）
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 检测级联（规则 / 决策 / 知识 / LLM）
        - 归因与报告
        - 载体审校（图片 / PDF / Word）
        - Web 界面
        - 桌面端
        - 部署与运维
        - 评测与数据
    validations:
      required: true
